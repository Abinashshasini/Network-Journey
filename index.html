<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A cinematic 3D visualization of how your browser connects to the internet — from DNS lookup to page render"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Network Journey | Visualize the Invisible Internet</title>
    <link rel="preload" href="/fonts/jetbrains-mono-500.woff" as="font" type="font/woff" crossorigin />
    <script>
      // Apply saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem('nj-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
